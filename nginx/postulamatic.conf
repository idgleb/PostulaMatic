server {
    listen 80;
    server_name postulamatic.app www.postulamatic.app;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$server_name$request_uri; }
}

# Resolver dinámico de Docker para evitar problemas con IPs cambiantes
resolver 127.0.0.11 valid=10s;

server {
    listen 443 ssl;
    server_name postulamatic.app www.postulamatic.app;

    ssl_certificate     /etc/letsencrypt/live/postulamatic.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postulamatic.app/privkey.pem;

    # Configuración para archivos grandes (CVs)
    client_max_body_size 10M;
    client_body_timeout 60s;
    client_header_timeout 60s;
    
    location / {
        # Usar variable con resolver para resolución dinámica
        set $upstream http://postulamatic-postulamatic_web-1:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts del proxy
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Headers para evitar cache en desarrollo
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
